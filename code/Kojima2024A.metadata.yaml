abstract: In this study, we attempted to improve brain-computer interface (BCI) systems by means of auditory stream segregation
  in which alternately presented tones are perceived as sequences of various different tones (streams). A 3-class BCI using
  three tone sequences, which were perceived as three different tone streams, was investigated and evaluated. Each presented
  musical tone was generated by a software synthesizer. Eleven subjects took part in the experiment. Stimuli were presented
  to each user's right ear. Subjects were requested to attend to one of three streams and to count the number of target stimuli
  in the attended stream. In addition, 64-channel electroencephalogram (EEG) and two-channel electrooculogram (EOG) signals
  were recorded from participants with a sampling frequency of 1000 Hz. The measured EEG data were classified based on Riemannian
  geometry to detect the object of the subject's selective attention. P300 activity was elicited by the target stimuli in
  the segregated tone streams. In five out of eleven subjects, P300 activity was elicited only by the target stimuli included
  in the attended stream. In a 10-fold cross validation test, a classification accuracy over 80% for five subjects and over
  75% for nine subjects was achieved. For subjects whose accuracy was lower than 75%, either the P300 was also elicited for
  nonattended streams or the amplitude of P300 was small. It was concluded that the number of selected BCI systems based on
  auditory stream segregation can be increased to three classes, and these classes can be detected by a single ear without
  the aid of any visual modality.
