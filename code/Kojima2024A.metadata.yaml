file_format: BrainVision
methodology: Musical tones generated by a digital auditory workstation were used as auditory stimuli. Piano tones from a MIDI
  sound source were presented using a digital signal processor and headphones to participants' right ear only. Three tone
  streams were created using auditory stream segregation, each consisting of standard (90% probability) and deviant (10% probability)
  tones. The duration of each tone was 150 ms with stimulus onset asynchrony of 180 ms. The 64-channel EEG and 2-channel EOG
  signals were recorded at 1000 Hz. Each experiment consisted of two task blocks with three runs each (5 minutes per run).
  Subjects counted target stimuli in different streams across runs. Data analysis involved bandpass filtering (0.1-40 Hz for
  ERP analysis, 1-40 Hz for classification), baseline correction, artifact rejection (±100μV for EEG, ±500μV for EOG), xDAWN
  spatial filtering, and classification using Riemannian geometry with covariance matrices and logistic regression. Performance
  was evaluated using 10-fold cross validation with accuracy and Matthews correlation coefficient (MCC) metrics.
